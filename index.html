<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise 💖</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e7, #f6d9ff, #e7dcff);
            font-family: "Comic Sans MS", "Segoe UI", cursive;
            overflow: hidden;
        }

        .card {
            width: 460px;
            max-width: 90%;
            background: rgba(255, 255, 255, 0.96);
            padding: 55px 35px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(131, 77, 142, 0.20);
            position: relative;
            z-index: 5;
            animation: cardAppear 1s ease;
        }

        h1 {
            font-size: 42px;
            color: #ff4f87;
            margin-bottom: 20px;
            animation: cuteBounce 2s infinite;
        }

        p {
            font-size: 18px;
            color: #777;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 28px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            min-height: 80px;
        }

        .yes-btn,
        .no-btn {
            min-width: 125px;
            padding: 15px 28px;
            border-radius: 30px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .yes-btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff5a91, #ff81aa);
            color: white;
            text-decoration: none;
            box-shadow: 0 6px 18px rgba(255, 90, 145, 0.35);
            transition: 0.3s;
            position: relative;
            z-index: 50;
        }

        .yes-btn:hover {
            transform: scale(1.1);
        }

        .no-btn {
            border: none;
            background: #eeeeee;
            color: #444;
            position: relative;
            z-index: 40;
            transition: transform 0.2s ease;
        }

        .heart {
            position: fixed;
            bottom: -50px;
            font-size: 25px;
            pointer-events: none;
            animation: floatHeart 7s linear infinite;
        }

        .h1 { left: 10%; animation-delay: 0s; }
        .h2 { left: 28%; animation-delay: 2s; }
        .h3 { left: 55%; animation-delay: 4s; }
        .h4 { left: 75%; animation-delay: 1s; }
        .h5 { left: 90%; animation-delay: 3s; }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(40px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes cuteBounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        @keyframes floatHeart {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            20% {
                opacity: 0.7;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 500px) {
            .card {
                padding: 45px 20px;
            }

            h1 {
                font-size: 35px;
            }

            h2 {
                font-size: 21px;
            }

            .yes-btn,
            .no-btn {
                min-width: 105px;
                padding: 14px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="heart h1">💕</div>
    <div class="heart h2">♥</div>
    <div class="heart h3">✨</div>
    <div class="heart h4">💗</div>
    <div class="heart h5">♡</div>

    <main class="card">

        <h1>Heyyy! 💖</h1>

        <p>
            I made a little surprise for you ✨
        </p>

        <h2>
            Do you want to see it? 👀
        </h2>

        <div class="buttons">

            <a
                class="yes-btn"
                href="surprise.html"
            >
                YES 💕
            </a>

            <button
                class="no-btn"
                id="noBtn"
                type="button"
            >
                NO 😂
            </button>

        </div>

    </main>

    <script>
        const noButton = document.getElementById("noBtn");

        function moveNoButton() {
            const x = Math.random() * 220 - 110;
            const y = Math.random() * 130 - 65;

            noButton.style.transform =
                `translate(${x}px, ${y}px)`;
        }

        noButton.addEventListener("mouseenter", moveNoButton);
        noButton.addEventListener("click", moveNoButton);
        noButton.addEventListener("touchstart", moveNoButton);
    </script>

</body>

</html>
